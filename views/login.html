<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/assets/img-e02cd94544.png">
  <title>Natus - Gestão Inteligente de Leitos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a4d6e 0%, #3d7ea6 55%, #eeb3ae 130%);
      min-height: 100vh; display: flex; align-items: center;
    }
    .login-card { max-width: 400px; margin: 0 auto; border-radius: 18px; overflow: hidden; }
    .login-logo { width: 132px; height: 132px; object-fit: contain; display: block; margin: 0 auto; }
    .login-footer-brand { letter-spacing: .04em; }
  </style>
  <script src="/natus-rpc.js"></script>
</head>
<body>
  <div class="container">
    <div class="card login-card shadow-lg border-0 p-4">
      <div class="text-center mb-2">
        <img class="login-logo" src="/assets/img-692869aa73.png" alt="Natus - Gestão Inteligente de Leitos">
        <p class="text-muted small mb-0 mt-1">Maternidade Ana Braga &middot; Acesse com seu usuário cadastrado</p>
      </div>
      <div id="alertaErro" class="alert alert-danger py-2 small d-none"></div>
      <form id="formLogin">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Nome</label>
          <input type="text" class="form-control" id="loginNome" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Senha</label>
          <input type="password" class="form-control" id="loginSenha" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold" id="btnEntrar" style="background:#3d7ea6; border-color:#3d7ea6;">
          <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
        </button>
      </form>
      <p class="text-center text-muted small mt-3 mb-0 login-footer-brand">Acesso restrito a usuários cadastrados pela equipe do SAME.</p>
    </div>
  </div>

  <script>
    const appUrl = "<?!= appUrl ?>";

    document.getElementById('formLogin').addEventListener('submit', function (e) {
      e.preventDefault();
      const nome = document.getElementById('loginNome').value.trim();
      const senha = document.getElementById('loginSenha').value;
      const btn = document.getElementById('btnEntrar');
      const alerta = document.getElementById('alertaErro');
      alerta.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Entrando...';

      google.script.run
        .withSuccessHandler(function (res) {
          // Perfis "NIR" e "Gestão" (mesmas autorizações do NIR) abrem o painel geral;
          // qualquer outro perfil abre direto o setor cadastrado.
          const destino = (res.perfil === 'NIR' || res.perfil === 'Gestão')
            ? `${appUrl}?view=nir&token=${res.token}`
            : `${appUrl}?token=${res.token}`;
          window.top.location.href = destino;
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Entrar';
          alerta.textContent = err.message || 'Não foi possível entrar. Verifique nome e senha.';
          alerta.classList.remove('d-none');
        })
        .autenticar(nome, senha);
    });
  </script>
</body>
</html>
