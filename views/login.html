<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/assets/img-e02cd94544.png">
  <title>Natus - Gestão Inteligente de Leitos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <script src="/natus-rpc.js"></script>
  <!--@head-->
</head>
<body class="nt-login">
  <button type="button" class="nt-iconbtn nt-theme-float" data-natus-theme-toggle aria-label="Alternar tema"><i class="bi bi-moon-stars-fill"></i></button>
  <main class="card login-card border-0">
    <div class="card-body">
      <div class="text-center mb-4">
        <img class="login-logo" src="/assets/img-692869aa73.png" alt="Natus - Gestão Inteligente de Leitos">
        <h1 class="h4 fw-bold mt-3 mb-1">Bem-vindo ao Natus</h1>
        <p class="text-muted small mb-0">Maternidade Ana Braga &middot; Acesse com seu usuário cadastrado</p>
      </div>
      <div id="alertaErro" class="alert alert-danger py-2 small d-none mt-3" role="alert"></div>
      <form id="formLogin">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Nome</label>
          <input type="text" class="form-control" id="loginNome" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Senha</label>
          <input type="password" class="form-control" id="loginSenha" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold" id="btnEntrar">
          <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
        </button>
      </form>
      <p class="text-center text-muted small mt-4 mb-0 login-footer-brand">Acesso restrito a usuários cadastrados pela equipe do SAME.</p>
    </div>
  </main>

  <script>
    const appUrl = "<?!= appUrl ?>";

    document.getElementById('formLogin').addEventListener('submit', function (e) {
      e.preventDefault();
      const nome = document.getElementById('loginNome').value.trim();
      const senha = document.getElementById('loginSenha').value;
      const btn = document.getElementById('btnEntrar');
      const alerta = document.getElementById('alertaErro');
      alerta.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Entrando...';

      google.script.run
        .withSuccessHandler(function (res) {
          // Perfis "NIR" e "Gestão" (mesmas autorizações do NIR) abrem o painel geral;
          // qualquer outro perfil abre direto o setor cadastrado.
          const destino = (res.perfil === 'NIR' || res.perfil === 'Gestão')
            ? `${appUrl}?view=nir&token=${res.token}`
            : `${appUrl}?token=${res.token}`;
          window.top.location.href = destino;
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Entrar';
          alerta.textContent = err.message || 'Não foi possível entrar. Verifique nome e senha.';
          alerta.classList.remove('d-none');
        })
        .autenticar(nome, senha);
    });
  </script>
</body>
</html>
